# Claude Code inside tmux: Shift+Enter, desktop notifications, progress bar.
# See https://code.claude.com/docs/en/terminal-config
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# allow-passthrough needs tmux 3.3+; Ubuntu 22.04 ships 3.2a.
%if #{>=:#{version},3.3}
set -g allow-passthrough on
%endif
